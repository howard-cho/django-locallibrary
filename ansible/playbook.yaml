- hosts: nginx
  become: true
  tasks:
    - name: Install nginx, certbot, and the Route 53 plugin
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-dns-route53
        state: present
        update_cache: yes

    - name: Obtain certificate via Route53 DNS challenge
      command: >
        certbot certonly --dns-route53
        -d library.howardcho.com
        --non-interactive --agree-tos
        -m email@howardcho.com
      args:
        creates: /etc/letsencrypt/live/library.howardcho.com/fullchain.pem

    - name: Deploy nginx reverse proxy config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/library.howardcho.com
      notify: restart nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/library.howardcho.com
        dest: /etc/nginx/sites-enabled/library.howardcho.com
        state: link
      notify: restart nginx

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
    