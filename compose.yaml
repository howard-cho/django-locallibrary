services:
  server:
    image: chohoward/django-locallibrary:latest
    build:
      context: .
      target: runtime
    ports:
      - 8000:8000
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    env_file:
      - .env
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: rebuild
          path: .
  migrate:
    image: chohoward/django-locallibrary:latest
    build:
      context: .
      target: runtime
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    env_file:
      - .env
    secrets:
      - db-password
    command: python3 manage.py migrate
    depends_on:
      db:
        condition: service_healthy
  db:
    image: dhi.io/postgres:18
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    env_file:
      - .env
    secrets:
      - db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt