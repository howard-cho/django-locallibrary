- hosts: nginx
  become: true
  tasks:
    - name: Install aptitude
      apt:
        name: aptitude
        state: latest
        update_cache: yes
    
    - name: Install required system packages
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-dns-route53
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: yes

    # Guide to install Docker with Ansible: https://www.digitalocean.com/community/tutorials/how-to-use-ansible-to-install-and-set-up-docker-on-ubuntu-20-04
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: De-armor Docker GPG key for APT
      command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt and install Docker Engine
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Obtain certificate via Route53 DNS challenge
      command: >
        certbot certonly --dns-route53
        -d library.howardcho.com
        --non-interactive --agree-tos
        -m email@howardcho.com
      args:
        creates: /etc/letsencrypt/live/library.howardcho.com/fullchain.pem

    - name: Deploy nginx reverse proxy config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/library.howardcho.com
      notify: restart nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/library.howardcho.com
        dest: /etc/nginx/sites-enabled/library.howardcho.com
        state: link
      notify: restart nginx

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
    